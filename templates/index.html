<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radius Near You</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0/leaflet-maplibre-gl.js"></script>
  <script>
    // Set the theme before first paint so the page doesn't flash the wrong colors
    document.documentElement.dataset.theme = localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <style>
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff; --fg: #111827; --muted: #6b7280; --border: #e5e7eb; --hover: #2563eb14;
      --accent: #2563eb; --on-accent: #ffffff; --error: #dc2626;
      --control-bg: #ffffff; --control-hover: #f3f4f6; --switch-off: #d1d5db;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f172a; --fg: #e5e7eb; --muted: #94a3b8; --border: #334155; --hover: #60a5fa1f;
      --accent: #60a5fa; --on-accent: #0f172a; --error: #f87171;
      --control-bg: #1e293b; --control-hover: #334155; --switch-off: #475569;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.4; display: grid; grid-template-columns: 380px 1fr; background: var(--bg); color: var(--fg); }
    aside { overflow-y: auto; padding: 1.25rem; border-right: 1px solid var(--border); }
    #map { height: 100%; }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .sub { color: var(--muted); margin: 0 0 1rem; font-size: .9rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    input { flex: 1 1 100%; padding: .6rem .75rem; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; }
    input::placeholder { color: var(--muted); }
    input[aria-invalid="true"] { border-color: var(--error); outline: 2px solid color-mix(in srgb, var(--error) 35%, transparent); }
    .field-error { flex: 1 1 100%; margin: -.25rem 0 0; color: var(--error); font-size: .85rem; }
    button { flex: 1; padding: .55rem .8rem; font-size: .95rem; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: .6; cursor: wait; }
    code { background: var(--hover); padding: 0 .25em; border-radius: 4px; }
    .hint { color: var(--muted); font-size: .8rem; margin: .5rem 0 0; }
    .counts { margin-top: .75rem; padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 10px; display: grid; gap: .4rem; }
    .counts h2 { font-size: .85rem; margin: 0; color: var(--muted); font-weight: 500; }
    .count-row { display: grid; grid-template-columns: 5.5rem 1fr 3.75rem; align-items: center; gap: .6rem; font-size: .9rem; }
    .count-row input[type="number"] { padding: .3rem .4rem; font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; }
    .count-row input[type="range"] { padding: 0; border: 0; outline: 0; accent-color: var(--accent); cursor: pointer; }
    .radius-ring { stroke: var(--accent); }
    #status { margin: 1rem 0 0; font-size: .9rem; }
    .error { color: var(--error); }
    section { margin-top: 1.25rem; }
    h2 { font-size: 1rem; margin: 0 0 .5rem; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { padding: .5rem .6rem; border-radius: 8px; cursor: pointer; }
    li:hover { background: var(--hover); }
    .settings { margin: 0 0 1rem; border: 1px solid var(--border); border-radius: 10px; }
    .settings summary { padding: .5rem .75rem; cursor: pointer; font-size: .9rem; font-weight: 500; user-select: none; }
    .settings .row { display: flex; align-items: center; justify-content: space-between; padding: .5rem .75rem .75rem; font-size: .9rem; }
    .switch { flex: none; position: relative; width: 44px; height: 24px; padding: 0; border-radius: 999px; background: var(--switch-off); transition: background .2s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(20px); }
    /* Leaflet controls and popups follow the theme */
    .leaflet-container { background: var(--bg); }
    .leaflet-container a { color: var(--accent); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--control-bg); color: var(--fg); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
    .leaflet-bar a, .leaflet-bar a.leaflet-disabled { background: var(--control-bg); color: var(--fg); border-bottom-color: var(--border); }
    .leaflet-bar a:hover { background: var(--control-hover); }
    .leaflet-container .leaflet-control-attribution { background: color-mix(in srgb, var(--control-bg) 80%, transparent); color: var(--muted); }
    li .title { font-weight: 600; }
    li .meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .weather { padding: .9rem 1rem; border: 1px solid var(--border); border-radius: 12px; }
    .weather .temp { font-size: 2rem; font-weight: 600; line-height: 1; }
    .weather .cond { font-weight: 500; }
    .weather .feels { color: var(--muted); font-size: .85rem; }
    .weather dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem 1rem; margin: .75rem 0 0; }
    .weather dt { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; }
    .weather dd { margin: 0; font-size: .9rem; font-variant-numeric: tabular-nums; }
    .emoji-icon { --glow: #22d3ee; }
    .emoji-icon.train { --glow: #fbbf24; }
    .emoji-icon span {
      display: block; font-size: 30px; line-height: 40px; text-align: center;
      filter: drop-shadow(0 0 1px var(--glow)) drop-shadow(0 0 4px var(--glow)) drop-shadow(0 0 10px var(--glow));
    }
    /* Markers already stand out on the dark map, so tone the glow down */
    [data-theme="dark"] .emoji-icon span {
      filter: drop-shadow(0 0 1px var(--glow)) drop-shadow(0 0 5px color-mix(in srgb, var(--glow) 60%, transparent));
    }
    a { color: var(--accent); }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: 50vh auto; height: auto; }
      #map { order: -1; height: 50vh; }
      aside { border-right: 0; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Radius</h1>
    <p class="sub">Current weather and the nearest aircraft and Amtrak trains to any location.</p>

    <details class="settings">
      <summary>⚙️ Settings</summary>
      <div class="row">
        <label for="theme-switch">🌙 Dark mode</label>
        <button type="button" id="theme-switch" class="switch" role="switch" aria-checked="false"></button>
      </div>
    </details>

    <form id="search">
      <input id="q" name="q" placeholder="City, address, ZIP, or coordinates" autocomplete="off" aria-describedby="q-error">
      <p id="q-error" class="field-error" role="alert" hidden>You must enter a location.</p>
      <button type="submit">Search</button>
      <button type="button" class="secondary" id="locate">Use my location</button>
    </form>
    <p class="hint">Try <code>Chicago</code>, <code>10001</code>, <code>40.7128, -74.0060</code>, or a Google Maps link. You can also click anywhere on the map.</p>

    <div class="counts">
      <h2>Results to show</h2>
      <div class="count-row">
        <label for="planes-range">✈️ Planes</label>
        <input type="range" id="planes-range" min="0" max="50" value="5">
        <input type="number" id="planes-num" min="0" max="50" value="5" aria-label="Number of planes">
      </div>
      <div class="count-row">
        <label for="trains-range">🚆 Trains</label>
        <input type="range" id="trains-range" min="0" max="50" value="5">
        <input type="number" id="trains-num" min="0" max="50" value="5" aria-label="Number of trains">
      </div>
      <div class="count-row">
        <label for="radius-range">📏 Radius</label>
        <input type="range" id="radius-range" min="1" max="250" value="50">
        <input type="number" id="radius-num" min="1" max="250" value="50" aria-label="Search radius in miles" title="Miles">
      </div>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </aside>
  <div id="map"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (v) => v == null || v === "" ? "–" :
      String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (v, unit, digits = 0) => v == null ? "–" : `${Number(v).toFixed(digits)}${unit}`;

    // ---- Map ----
    const map = L.map("map", { worldCopyJump: true, maxZoom: 19 }).setView([39.5, -98.35], 4);
    // OpenFreeMap vector basemaps (free, no API key), drawn by MapLibre inside Leaflet
    const BASEMAP_STYLES = {
      light: "https://tiles.openfreemap.org/styles/positron",
      dark: "https://tiles.openfreemap.org/styles/dark",
    };
    const BASEMAP_CREDIT = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> ' +
      '&copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> ' +
      'Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
    let basemap;

    // ---- Theme ----
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      $("theme-switch").setAttribute("aria-checked", theme === "dark");
      if (basemap) map.removeLayer(basemap);
      basemap = L.maplibreGL({ style: BASEMAP_STYLES[theme], attribution: BASEMAP_CREDIT }).addTo(map);
    }
    applyTheme(document.documentElement.dataset.theme);

    $("theme-switch").addEventListener("click", () => {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme", theme);
      applyTheme(theme);
    });
    // Follow the system setting until the user picks a theme themselves
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
      if (!localStorage.getItem("theme")) applyTheme(e.matches ? "dark" : "light");
    });

    const layer = L.layerGroup().addTo(map);
    // Dotted outline of the search radius; kept outside `layer` so the slider can resize it live
    const radiusCircle = L.circle([0, 0], { radius: 0, className: "radius-ring", weight: 2, dashArray: "2 8", lineCap: "round", fill: false, interactive: false });
    let markers = { planes: [], trains: [] };

    const emojiIcon = (emoji, kind, rotate = 0) => L.divIcon({
      className: `emoji-icon ${kind}`,
      html: `<span style="transform: rotate(${rotate}deg)">${emoji}</span>`,
      iconSize: [40, 40],
      iconAnchor: [20, 20],
    });

    map.on("click", (e) => {
      const { lat, lng } = e.latlng.wrap();
      $("q").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      search({ q: $("q").value });
    });

    // ---- Sidebar rendering ----
    function weatherSection({ data: w, error }) {
      let inner;
      if (error) inner = `<p class="error">${esc(error)}</p>`;
      else {
        const wind = w.wind_mph == null ? "–" : `${fmt(w.wind_mph, " mph")}${w.wind_dir ? " " + w.wind_dir : ""}`;
        inner = `<div class="weather">
          <div class="temp">${fmt(w.temperature_f, "°F")}</div>
          <div class="cond">${esc(w.conditions)}</div>
          <div class="feels">Feels like ${fmt(w.feels_like_f, "°F")}</div>
          <dl>
            <div><dt>Wind</dt><dd>${esc(wind)}</dd></div>
            <div><dt>Gusts</dt><dd>${fmt(w.wind_gusts_mph, " mph")}</dd></div>
            <div><dt>Humidity</dt><dd>${fmt(w.humidity_pct, "%")}</dd></div>
            <div><dt>Clouds</dt><dd>${fmt(w.cloud_cover_pct, "%")}</dd></div>
            <div><dt>Precip</dt><dd>${fmt(w.precipitation_in, " in", 2)}</dd></div>
          </dl>
        </div>`;
      }
      return `<section><h2>🌤️ Current weather</h2>${inner}</section>`;
    }

    function listSection(title, kind, data, describe, emptyMsg) {
      let inner;
      if (data.error) inner = `<p class="error">${esc(data.error)}</p>`;
      else if (!data.rows.length) inner = `<p>${emptyMsg}</p>`;
      else inner = "<ol>" + data.rows.map((r, i) => {
        const { title, meta } = describe(r);
        return `<li data-kind="${kind}" data-i="${i}"><div class="title">${i + 1}. ${title}</div><div class="meta">${meta}</div></li>`;
      }).join("") + "</ol>";
      return `<section><h2>${title}</h2>${inner}</section>`;
    }

    const describePlane = (r) => ({
      title: `${esc(r.callsign)} <span class="meta">${esc(r.type)} · ${esc(r.reg)}</span>`,
      meta: `${fmt(r.distance_nm, " nm", 1)} away · ${typeof r.alt_ft === "number" ? r.alt_ft.toLocaleString() + " ft" : esc(r.alt_ft)} · ${fmt(r.speed_kt, " kt")}`,
    });
    const describeTrain = (r) => ({
      title: `Train ${esc(r.number)} <span class="meta">${esc(r.route)}</span>`,
      meta: `${fmt(r.distance_mi, " mi", 1)} away · to ${esc(r.destination)} · ${fmt(r.speed_mph, " mph")}`,
    });

    $("results").addEventListener("click", (e) => {
      const li = e.target.closest("li[data-kind]");
      const marker = li && markers[li.dataset.kind][li.dataset.i];
      if (!marker) return;
      map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 10));
      marker.openPopup();
    });

    // ---- Map rendering ----
    function plotResults(data) {
      layer.clearLayers();
      const { lat, lon, label } = data.location;
      radiusCircle.setLatLng([lat, lon]).setRadius(data.radius_mi * METERS_PER_MILE).addTo(map);
      L.circleMarker([lat, lon], { radius: 9, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 })
        .bindPopup(`<strong>${esc(label)}</strong>`)
        .addTo(layer);

      markers.planes = data.planes.rows.map((r) =>
        L.marker([r.lat, r.lon], { icon: emojiIcon("✈️", "plane", (r.track ?? 45) - 45) })  // emoji points NE
          .bindPopup(`<strong>${esc(r.callsign)}</strong><br>${describePlane(r).meta}<br>
            <a href="https://globe.adsb.lol/?icao=${encodeURIComponent(r.hex)}" target="_blank" rel="noopener">Track on adsb.lol</a>`)
          .addTo(layer));
      markers.trains = data.trains.rows.map((r) =>
        L.marker([r.lat, r.lon], { icon: emojiIcon("🚆", "train") })
          .bindPopup(`<strong>Train ${esc(r.number)} — ${esc(r.route)}</strong><br>${describeTrain(r).meta}`)
          .addTo(layer));

      map.flyToBounds(L.latLng(lat, lon).toBounds(2 * radiusCircle.getRadius()), { padding: [20, 20] });
    }

    // ---- Result counts ----
    const MAX_COUNT = 50;
    let lastParams = null;

    function setCount(kind, value) {
      const n = Math.max(0, Math.min(MAX_COUNT, parseInt(value, 10) || 0));
      $(`${kind}-range`).value = $(`${kind}-num`).value = n;
      localStorage.setItem(`count-${kind}`, n);
      return n;
    }

    // ---- Search radius (miles) ----
    const MAX_RADIUS = 250, METERS_PER_MILE = 1609.344;

    function setRadius(value) {
      const r = Math.max(1, Math.min(MAX_RADIUS, parseInt(value, 10) || 1));
      $("radius-range").value = $("radius-num").value = r;
      localStorage.setItem("radius", r);
      return r;
    }

    setRadius(localStorage.getItem("radius") ?? 50);
    $("radius-range").addEventListener("input", () => {
      $("radius-num").value = $("radius-range").value;
      radiusCircle.setRadius($("radius-range").value * METERS_PER_MILE);  // live while dragging
    });
    $("radius-num").addEventListener("input", () => { if ($("radius-num").value !== "") $("radius-range").value = $("radius-num").value; });
    for (const el of [$("radius-range"), $("radius-num")]) {
      el.addEventListener("change", () => {
        setRadius(el.value);
        if (lastParams) search(lastParams);
      });
    }

    for (const kind of ["planes", "trains"]) {
      const range = $(`${kind}-range`), num = $(`${kind}-num`);
      setCount(kind, localStorage.getItem(`count-${kind}`) ?? 5);
      range.addEventListener("input", () => (num.value = range.value));  // live while dragging
      num.addEventListener("input", () => { if (num.value !== "") range.value = num.value; });
      // Re-run the last search once the user lets go of the slider or finishes typing
      for (const el of [range, num]) {
        el.addEventListener("change", () => {
          setCount(kind, el.value);
          if (lastParams) search(lastParams);
        });
      }
    }

    // ---- Search ----
    async function search(params) {
      setQueryError(false);
      lastParams = params;
      const counts = { planes: setCount("planes", $("planes-num").value), trains: setCount("trains", $("trains-num").value) };
      const radius = setRadius($("radius-num").value);
      const buttons = document.querySelectorAll("button");
      buttons.forEach((b) => (b.disabled = true));
      $("status").textContent = "Searching…";
      $("results").innerHTML = "";
      try {
        const res = await fetch("/api/nearby?" + new URLSearchParams({ ...params, ...counts, radius }));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        const { lat, lon, label } = data.location;
        $("status").innerHTML = `Near <strong>${esc(label)}</strong> (${lat.toFixed(4)}, ${lon.toFixed(4)}) · within ${data.radius_mi} mi`;
        $("results").innerHTML =
          weatherSection(data.weather) +
          (counts.planes ? listSection("✈️ Nearest aircraft", "planes", data.planes, describePlane, `No aircraft found within ${data.radius_mi} mi.`) : "") +
          (counts.trains ? listSection("🚆 Nearest Amtrak trains", "trains", data.trains, describeTrain, `No active Amtrak trains found within ${data.radius_mi} mi.`) : "");
        plotResults(data);
      } catch (err) {
        $("status").innerHTML = `<span class="error">${esc(err.message)}</span>`;
      } finally {
        buttons.forEach((b) => (b.disabled = false));
      }
    }

    function setQueryError(show) {
      $("q").setAttribute("aria-invalid", show);
      $("q-error").hidden = !show;
    }

    $("search").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = $("q").value.trim();
      if (!q) {
        setQueryError(true);
        $("q").focus();
        return;
      }
      search({ q });
    });
    $("q").addEventListener("input", () => setQueryError(false));

    $("locate").addEventListener("click", () => {
      if (!navigator.geolocation) return ($("status").textContent = "Geolocation isn't supported by your browser.");
      $("status").textContent = "Getting your location…";
      navigator.geolocation.getCurrentPosition(
        (pos) => search({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        (err) => ($("status").innerHTML = `<span class="error">${esc(err.message)}</span>`),
        { timeout: 10000 }
      );
    });
  </script>
</body>
</html>
